services:
  api:
    build:
      context: .
    ports:
      - "3000:3000"
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:1.20.1
    depends_on:
      - api
    ports:
      - "1935:1935"
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./recordings:/recordings
    restart: unless-stopped
